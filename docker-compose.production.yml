services:
  frontend:
    image: ghcr.io/nakakonakako/price-memo-frontend:latest
    container_name: price-frontend
    ports:
      # A (receipt-manager) が host :80 を使う想定。B は別ポート。
      # ドメイン前段の reverse proxy があれば、そちらからこのポートへ振る。
      - "8081:80"
    volumes:
      - ./nginx-config/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - price-backend

  price-backend:
    image: ghcr.io/nakakonakako/price-memo-backend:latest
    container_name: price-backend
    expose:
      - "8000"
    env_file:
      - ./.env
