[project]
name = "price-memo-backend"
version = "0.1.0"
description = "Strict unit-price comparison API (feature B)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.124.0",
    "python-dotenv>=1.2.1",
    "python-multipart>=0.0.20",
    "ruff>=0.14.10",
    "supabase>=2.28.0",
    "uvicorn>=0.38.0",
]

[tool.ruff]
line-length = 88
target-version = "py312"
