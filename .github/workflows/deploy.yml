name: CI/CD Pipeline

on:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  quality:
    runs-on: ubuntu-latest
  
    steps:
      - name: Checkout
        uses: actions/checkout@v7
  
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
  
      - name: Install frontend dependencies
        run: npm ci --prefix frontend
  
      - name: Setup uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: "3.12"
          enable-cache: true
  
      - name: Install backend dependencies
        run: uv sync --directory backend --frozen
  
      - name: Run quality checks
        run: npm run check

  production-db-check:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: production-db-check
    permissions:
      contents: read

    steps:
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Git and PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends git postgresql-client
          command -v python3
          command -v git
          command -v psql

      - name: Verify production DB compatibility with the deployed app revision
        uses: nakakonakako/shared-supabase-db/.github/actions/consumer-production-db-check@c06454f78cc3db27964829fd0e357cbb0d3536f8
        with:
          app-id: price-memo
          app-commit-sha: ${{ github.sha }}
          reader-pooler-host: ${{ vars.PROD_SUPABASE_POOLER_HOST }}
          reader-project-ref: ${{ vars.PROD_SUPABASE_PROJECT_REF }}
          reader-username: migration_preflight_login.${{ vars.PROD_SUPABASE_PROJECT_REF }}
          reader-password: ${{ secrets.MIGRATION_READER_PASSWORD }}

  build-and-push:
    needs: [quality, production-db-check]
    if: ${{ needs.quality.result == 'success' && needs.production-db-check.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Docker Setup
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build/Push Frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-frontend:latest
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend
          build-args: |
            VITE_SUPABASE_URL=${{ secrets.PROD_SUPABASE_URL }}
            VITE_SUPABASE_PUBLISHABLE_KEY=${{ secrets.PROD_SUPABASE_PUBLISHABLE_KEY }}
            VITE_API_URL=/api

      - name: Build/Push Backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-backend:latest
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

  deploy:
    needs: [quality, production-db-check, build-and-push]
    if: ${{ needs.quality.result == 'success' && needs.production-db-check.result == 'success' && needs.build-and-push.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify this deployment is still the latest main commit
        run: python3 scripts/assert_latest_deploy_main.py

      - name: SCP Transfer
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "docker-compose.production.yml, nginx-config"
          target: "~/price-memo"

      - name: Recheck current main immediately before deployment
        run: python3 scripts/assert_latest_deploy_main.py

      - name: SSH Deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            bash <<'DEPLOY'
            set -euo pipefail
            cd ~/price-memo

            umask 077
            if [[ -L .env || ( -e .env && ! -f .env ) ]]; then
              echo ".env must be a regular file" >&2
              exit 1
            fi
            if [[ -e .env ]]; then
              chmod 600 -- .env
              if [[ "$(stat -c '%a' -- .env)" != 600 ]]; then
                echo ".env permissions are not 0600" >&2
                exit 1
              fi
            fi

            env_tmp="$(mktemp ./.env.tmp.XXXXXX)"
            trap 'rm -f -- "$env_tmp"' EXIT
            cat > "$env_tmp" <<'EOF'
            SUPABASE_URL=${{ secrets.PROD_SUPABASE_URL }}
            SUPABASE_KEY=${{ secrets.PROD_SUPABASE_PUBLISHABLE_KEY }}
            EOF
            chmod 600 -- "$env_tmp"
            if [[ "$(stat -c '%a' -- "$env_tmp")" != 600 ]]; then
              echo "temporary .env permissions are not 0600" >&2
              exit 1
            fi
            mv -fT -- "$env_tmp" .env
            if [[ "$(stat -c '%a' -- .env)" != 600 ]]; then
              echo ".env permissions are not 0600" >&2
              exit 1
            fi

            docker compose -f docker-compose.production.yml pull
            docker compose -f docker-compose.production.yml up -d
            for container in price-frontend price-backend; do
              status=$(docker inspect --format '{{.State.Status}}' "$container")
              if [[ "$status" != running ]]; then
                echo "$container is $status" >&2
                exit 1
              fi
            done
            docker image prune -f
            DEPLOY
